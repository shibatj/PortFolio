<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080c" />
    <meta name="description" content="Phanuwat Arsanok (James) — AI undergraduate building ML in plain C, expert systems and practical web tools." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // ตั้งธีมและภาษาก่อน render เพื่อไม่ให้หน้าจอกะพริบผิดธีม
      try {
        var d = document.documentElement;
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        d.dataset.theme = t;
        var l = localStorage.getItem("lang");
        if (l !== "th" && l !== "en") l = (navigator.language || "").toLowerCase().indexOf("th") === 0 ? "th" : "en";
        d.lang = l;
      } catch (e) {}
    </script>
    <style>html{background:#07080c}html[data-theme="light"]{background:#f4f6f3}body{margin:0}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Prompt:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Phanuwat Arsanok — Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
